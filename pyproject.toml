[project]
name = "skills-dev"
version = "0.1.0"
description = "Development tools for authored agent skills"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0,<7",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "yamllint>=1.38.0,<2",
]
