[package]
name = "dispatch-tickets"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
description = "Dispatch approved implementation tickets through local CLI workers"
repository = "https://github.com/kellen-miller/skills"

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.7", features = ["derive"] }
fs2 = "0.4.3"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
hex = "0.4.3"
tempfile = "3.23"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }
signal-hook = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
