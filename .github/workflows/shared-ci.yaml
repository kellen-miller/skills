name: Shared CI
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: shared-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  workflows:
    uses: kellen-miller/ci/.github/workflows/gh-actions-lint.yaml@c7d3bb1cf4ddd49dc3fd32a8739449960f6b7416 # main
  renovate:
    uses: kellen-miller/ci/.github/workflows/renovate-config-validator.yaml@c7d3bb1cf4ddd49dc3fd32a8739449960f6b7416 # main
