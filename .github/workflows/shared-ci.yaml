name: Shared CI
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: shared-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  workflows:
    name: GitHub Actions
    uses: kellen-miller/ci/.github/workflows/gh-actions-lint.yaml@7cb397821439001322396a1b022cfa47dbe3a553 # main
  renovate:
    name: Renovate
    uses: kellen-miller/ci/.github/workflows/renovate-config-validator.yaml@7cb397821439001322396a1b022cfa47dbe3a553 # main
