name: Shared CI
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: shared-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  workflows:
    uses: kellen-miller/ci/.github/workflows/gh-actions-lint.yaml@6d83b6c0e8b6f407fa2f11e1c974449649cfa1f6 # main
  renovate:
    uses: kellen-miller/ci/.github/workflows/renovate-config-validator.yaml@6d83b6c0e8b6f407fa2f11e1c974449649cfa1f6 # main
