name: Shared CI
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: shared-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  workflows:
    name: GitHub Actions
    uses: kellen-miller/ci/.github/workflows/gh-actions-lint.yaml@eb1a4f5900aaa6468cffb67513da61078265ba26 # main
  renovate:
    name: Renovate
    uses: kellen-miller/ci/.github/workflows/renovate-config-validator.yaml@eb1a4f5900aaa6468cffb67513da61078265ba26 # main
