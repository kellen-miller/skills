name: Shared CI
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: shared-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  workflows:
    uses: kellen-miller/ci/.github/workflows/gh-actions-lint.yaml@0ee482cdd0ea61bc8b5d95cc8b45195fc0df0d66 # main
  renovate:
    uses: kellen-miller/ci/.github/workflows/renovate-config-validator.yaml@0ee482cdd0ea61bc8b5d95cc8b45195fc0df0d66 # main
