name: Shared CI
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: shared-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  workflows:
    uses: kellen-miller/ci/.github/workflows/gh-actions-lint.yaml@b08ba515b64f3563e51722faaea3d20d22283ed7 # main
  renovate:
    uses: kellen-miller/ci/.github/workflows/renovate-config-validator.yaml@b08ba515b64f3563e51722faaea3d20d22283ed7 # main
