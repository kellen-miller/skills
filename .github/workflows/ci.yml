name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prove GitHub credentials are absent
        shell: bash
        run: |
          status=0
          git config --show-origin --get-regexp '^http\..*\.extraheader$' \
            >"$RUNNER_TEMP/git-extraheaders.txt" || status=$?
          if [[ "$status" -eq 0 ]]; then
            cat "$RUNNER_TEMP/git-extraheaders.txt"
            echo "Git HTTP extraheader remains configured" >&2
            exit 1
          fi
          if [[ "$status" -ne 1 ]]; then
            echo "Unable to audit Git HTTP extraheaders" >&2
            exit "$status"
          fi
      - name: Check Rust workspace
        uses: kellen-miller/ci/.github/actions/rust-check@7cb397821439001322396a1b022cfa47dbe3a553 # main
      - name: Check standalone dispatcher
        shell: bash
        run: |
          cargo fmt --manifest-path dispatch-tickets/Cargo.toml -- --check
          cargo clippy --manifest-path dispatch-tickets/Cargo.toml --locked --all-targets --all-features -- -D warnings
          cargo test --manifest-path dispatch-tickets/Cargo.toml --locked --all-targets --all-features
          cargo test --manifest-path dispatch-tickets/Cargo.toml --locked --doc
      - name: Check assembled plugin
        shell: bash
        run: |
          cargo run --locked --bin skillctl -- package-plugin
          dist/kellen-skills/skills/dispatch-tickets/scripts/run --help
      - name: Regenerate anonymously
        shell: bash
        run: |
          env -u GH_TOKEN -u GITHUB_TOKEN -u GIT_ASKPASS \
            GIT_TERMINAL_PROMPT=0 ./target/debug/skillctl sync --no-claude
          test -z "$(git status --short --untracked-files=all)"
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Lint standalone dispatcher
        run: cargo clippy --manifest-path dispatch-tickets/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test standalone dispatcher
        run: cargo test --manifest-path dispatch-tickets/Cargo.toml --locked
      - name: Check PowerShell launcher
        run: ./dispatch-tickets/scripts/run.ps1 --help
  duplication:
    name: Code duplication (CPD)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check Rust duplication
        uses: kellen-miller/ci/.github/actions/code-duplication@7cb397821439001322396a1b022cfa47dbe3a553 # main
        with:
          # renovate: datasource=crate depName=jscpd versioning=semver
          version: '5.4.2'
