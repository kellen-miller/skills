name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
      - name: Prove GitHub credentials are absent
        shell: bash
        run: |
          status=0
          git config --show-origin --get-regexp '^http\..*\.extraheader$' \
            >"$RUNNER_TEMP/git-extraheaders.txt" || status=$?
          if [ "$status" -eq 0 ]; then
            cat "$RUNNER_TEMP/git-extraheaders.txt"
            echo "Git HTTP extraheader remains configured" >&2
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "Unable to audit Git HTTP extraheaders" >&2
            exit "$status"
          fi
      - name: Test and regenerate anonymously
        shell: bash
        run: |
          uv sync --locked
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked python -m unittest discover -s tests -v
          env -u GH_TOKEN -u GITHUB_TOKEN -u GIT_ASKPASS \
            GIT_TERMINAL_PROMPT=0 uv run --locked skillctl sync
          test -z "$(git status --short --untracked-files=all)"
