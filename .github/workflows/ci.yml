name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Prove GitHub credentials are absent
        shell: bash
        run: |
          status=0
          git config --show-origin --get-regexp '^http\..*\.extraheader$' \
            >"$RUNNER_TEMP/git-extraheaders.txt" || status=$?
          if [ "$status" -eq 0 ]; then
            cat "$RUNNER_TEMP/git-extraheaders.txt"
            echo "Git HTTP extraheader remains configured" >&2
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "Unable to audit Git HTTP extraheaders" >&2
            exit "$status"
          fi
      - name: Test and regenerate anonymously
        shell: bash
        run: |
          uv sync --locked
          uv run --locked yamllint --strict .
          uv run --locked ruff check .
          uv run --locked ruff format --check .
          uv run --locked python -m unittest discover -s tests -v
          env -u GH_TOKEN -u GITHUB_TOKEN -u GIT_ASKPASS \
            GIT_TERMINAL_PROMPT=0 uv run --locked skillctl sync --no-claude
          test -z "$(git status --short --untracked-files=all)"
