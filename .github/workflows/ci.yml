name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Prove GitHub credentials are absent
        shell: bash
        run: |
          status=0
          git config --show-origin --get-regexp '^http\..*\.extraheader$' \
            >"$RUNNER_TEMP/git-extraheaders.txt" || status=$?
          if [[ "$status" -eq 0 ]]; then
            cat "$RUNNER_TEMP/git-extraheaders.txt"
            echo "Git HTTP extraheader remains configured" >&2
            exit 1
          fi
          if [[ "$status" -ne 1 ]]; then
            echo "Unable to audit Git HTTP extraheaders" >&2
            exit "$status"
          fi
      - name: Check Rust workspace
        uses: kellen-miller/ci/.github/actions/rust-check@0ee482cdd0ea61bc8b5d95cc8b45195fc0df0d66 # main
      - name: Regenerate anonymously
        shell: bash
        run: |
          env -u GH_TOKEN -u GITHUB_TOKEN -u GIT_ASKPASS \
            GIT_TERMINAL_PROMPT=0 ./target/debug/skillctl sync --no-claude
          test -z "$(git status --short --untracked-files=all)"
  duplication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check Rust duplication
        uses: kellen-miller/ci/.github/actions/code-duplication@0ee482cdd0ea61bc8b5d95cc8b45195fc0df0d66 # main
        with:
          # renovate: datasource=crate depName=jscpd versioning=semver
          version: '5.4.1'
