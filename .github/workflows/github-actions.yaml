name: GitHub Actions
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: github-actions-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  workflow-validation:
    name: .github/workflows
    uses: kellen-miller/ci/.github/workflows/gh-actions-lint.yaml@def0c463d6083ec90ff66116bc0e300a9a727b84 # main
