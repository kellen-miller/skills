name: GitHub Actions
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: github-actions-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  workflow-validation:
    name: .github/workflows
    uses: kellen-miller/ci/.github/workflows/gh-actions-lint.yaml@4f4e514ee184fbd03b393a6d0e4bccb5eea63a9a # main
